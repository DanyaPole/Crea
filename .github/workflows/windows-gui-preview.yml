name: Build Windows GUI Preview

on:
  push:
    tags: ["v5.0.2-windows-gui"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows GUI preview
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DTECTONIC_ENABLE_IMGUI_OPENGL=ON

      - name: Build plugin
        run: cmake --build build --config Release --parallel

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Package Windows installer and plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $plugin = "build/Release/TectonicSynthV5.clap"
          if (!(Test-Path $plugin)) { throw "Expected plugin was not built: $plugin" }
          New-Item -ItemType Directory -Force -Path "build/staging", "build/package" | Out-Null
          Copy-Item $plugin "build/staging"
          Copy-Item "installer/install_windows.ps1" "build/staging"
          Compress-Archive -Path "build/staging/*" -DestinationPath "build/package/TectonicSynthV5-Windows-x64.zip"
          cpack --config build/CPackConfig.cmake -B build/package -G NSIS -C Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Get-ChildItem "build/package/*.exe")) { throw "NSIS did not produce a Windows installer" }

      - name: Upload Windows preview packages
        uses: actions/upload-artifact@v4
        with:
          name: TectonicSynthV5-Windows-GUI-Preview
          path: build/package/*
          if-no-files-found: error

  publish-preview:
    name: Publish Windows GUI preview
    if: github.ref == 'refs/tags/v5.0.2-windows-gui'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows preview packages
        uses: actions/download-artifact@v4
        with:
          name: TectonicSynthV5-Windows-GUI-Preview
          path: release_assets
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: Tectonic Synth v5.0.2 Windows GUI Preview
          files: release_assets/*
          prerelease: true
          make_latest: false
          generate_release_notes: true
